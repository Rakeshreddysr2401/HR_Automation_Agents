[project]
name = "hr-work-automation"
version = "0.1.0"
description = "Autonomous HR data migration agent with a defensible human-escalation boundary"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "python-multipart>=0.0.12",
    "langgraph>=0.2.60",
    "langgraph-checkpoint-sqlite>=2.0.1",
    "langchain-core>=0.3.28",
    "langchain-ollama>=0.2.2",
    "pandas>=2.2.0",
    "openpyxl>=3.1.5",
    "rapidfuzz>=3.10.0",
    "python-dateutil>=2.9.0",
    "pyyaml>=6.0.2",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.6.0",
    "httpx>=0.27.0",
    "numpy>=1.26.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "anyio>=4.6.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning"]
